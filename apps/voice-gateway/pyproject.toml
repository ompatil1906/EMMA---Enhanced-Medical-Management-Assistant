[project]
name = "emma-voice-gateway"
version = "0.2.0"
description = "EMMA voice gateway — FastAPI WebSocket foundation with an Exotel-compatible echo path (Day 2 assignment prototype)."
readme = "README.md"
authors = [{ name = "QuantumLoopAI assignment — Om Patil" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "azure-cognitiveservices-speech>=1.53,<2.0",
    "httpx>=0.28,<1.0",
    "qdrant-client>=1.20.0",
    # Day 18: the Deepgram streaming adapter needs websockets at RUNTIME (it was
    # dev-only, so a production install could not have used Deepgram STT).
    "websockets>=15,<16",
    # Day 12/13: LiveKit WebRTC voice runtime (optional — lazy imports;
    # only required when VOICE_TRANSPORT=livekit).
    "livekit>=1.0,<2.0",
    "livekit-agents>=0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.0,<2.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.12,<1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: requires real provider credentials and network access (skipped unless EMMA_RUN_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
