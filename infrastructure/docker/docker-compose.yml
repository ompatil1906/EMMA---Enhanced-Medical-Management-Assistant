name: emma-day2

services:
  voice-gateway:
    build:
      context: ../..
      dockerfile: apps/voice-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      EXOTEL_MODE: simulation
      WS_AUTH_TOKEN: ${WS_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

# Deliberately minimal (Day-2 scope): no MySQL/Qdrant/Redis/Langfuse — those
# arrive on the days their services exist (Day 3+).
